<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>formulario</h1>


  <form id="formRegistro">


    <div>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
    </div>


    <div>
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
    </div>

    
    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password">
    </div>


    <div>
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" min="0">
    </div>

    
    <div>
      <label for="fechaNacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento">
    </div>

    
    <div>
      <label>Género:</label><br>
      <input type="radio" id="generoMasculino" name="genero" value="masculino">
      <label for="generoMasculino">Masculino</label>

      <input type="radio" id="generoFemenino" name="genero" value="femenino">
      <label for="generoFemenino">Femenino</label>

      <input type="radio" id="generoOtro" name="genero" value="otro">
      <label for="generoOtro">Otro</label>
    </div>


    <div>
      <label>Intereses:</label><br>
      <input type="checkbox" id="interesDeportes" name="intereses" value="deportes">
      <label for="interesDeportes">Deportes</label>

      <input type="checkbox" id="interesMusica" name="intereses" value="musica">
      <label for="interesMusica">Música</label>

      <input type="checkbox" id="interesTecnologia" name="intereses" value="tecnologia">
      <label for="interesTecnologia">Tecnología</label>
    </div>


    <div>
      <label for="foto">Fotografía de perfil:</label>
      <input type="file" id="foto" name="foto">
    </div>


    <div>
      <label for="colorFavorito">Color favorito:</label>
      <input type="color" id="colorFavorito" name="colorFavorito">
    </div>

    
    <div>
      <label for="satisfaccion">Nivel de satisfacción:</label>
      <input type="range" id="satisfaccion" name="satisfaccion" min="0" max="100">
    </div>

    
    <button type="submit">Registrar</button>

  </form>
</body>
</html>
